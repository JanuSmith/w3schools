<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta charset="UTF-8" />
    <title>clear video Example</title>
  </head>
  <body>
    <style>
      .video-container {
        display: flex; /* center video horizontally */
        flex-direction: column; /* stack videos vertically */
        width: 100%;
        justify-content: center;
        background-color: rgb(1, 50, 174);
        margin-top: 20px; /*Adds spacing around video */
        padding: 40px; /*Adds padding around video */
      }
      iframe {
        width: 100%; /*Make video responsive */
        border-radius: 10px; /*smooth corners for a clean look */
        max-width: 400px; /* prevents video from dieng too */
        box-shadow: 0 4px 8px rgba(226, 26, 26, 0.2); /* subtle shadow */
        margin: 20px auto; /*Adds spacing around video */
      }
    </style>

    <div class="video-container">
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/Esi1wsP3ewg?si=W8Ri24YheIg-87Uv&amp;start=1"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/gi5tv_4p0z0?si=PyvAiivtemuTS6oy&amp;start=1"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </div>
  </body>
